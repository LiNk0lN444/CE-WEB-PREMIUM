<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | CE-web Constructora</title>

    <link rel="stylesheet" href="/ASSETS/CSS/login.css">
    <link rel="shortcut icon" href="../ASSETS/IMG/ce.png" type="image/x-icon">
</head>
<body>

    <!-- MENÚ DE NAVEGACIÓN -->

    <header>
        <nav class="navbar">

            <div class="logo">
                CE-Web Constructora
            </div>

            <ul class="menu">
                <li><a href="/index.html">Inicio</a></li>
                <li><a href="/index.html#nosotros">Nosotros</a></li>
                <li><a href="/VISTAS/catalogo.html">Catalogo</a></li>

                <li><a href="/VISTAS/inventario.html">Inventario</a></li>
                <li><a href="/index.html#servicios">Servicios</a></li>
                <li><a href="/index.html#contacto">Contacto</a></li>
            </ul>

            <div class="acciones">
                <button id="themeBtn" title="Cambiar tema">
                    🌙
                </button>
            </div>

        </nav>
    </header>

    <main>

        <div class="contenedor__todo">

            <div class="caja__trasera">

                <div class="caja__trasera-login">
                    <h3>¿Ya tienes una cuenta?</h3>

                    <p>
                        Inicia sesión para acceder a la plataforma.
                    </p>

                    <button id="btn__iniciar-sesion">Iniciar Sesión</button>
                </div>

                <div class="caja__trasera-register">
                    <h3>¿Aún no tienes una cuenta?</h3>

                    <p>
                        Regístrate para comenzar a utilizar nuestros servicios.
                    </p>

                    <button id="btn__registrarse">Registrarse</button>
                </div>

            </div>

            <!-- FORMULARIOS -->

            <div class="contenedor__login-register">

                <!-- LOGIN -->

                <form class="formulario__login" id="formularioLogin" novalidate>

                    <h2>Iniciar Sesión</h2>

                    <input type="email" id="loginEmail" placeholder="Correo Electrónico" required>

                    <input type="password" id="loginPassword" placeholder="Contraseña" required>

                    <span class="form-msg" id="loginError"></span>

                    <button type="submit">Entrar</button>

                </form>

                <!-- REGISTRO -->
                <form class="formulario__register" id="formularioRegistro" novalidate>

                    <h2>Registrarse</h2>

                    <input type="text" id="registerNombre" placeholder="Nombre Completo" required>

                    <input type="email" id="registerEmail" placeholder="Correo Electrónico" required>

                    <input type="text" id="registerUsuario" placeholder="Usuario" required>

                    <input type="password" id="registerPassword" placeholder="Contraseña" required>

                    <span class="form-msg" id="registerError"></span>

                    <button type="submit">Registrarse</button>

                </form>

            </div>

        </div>

    </main>

    <script src="/ASSETS/JS/auth.js"></script>
    <script src="../ASSETS/JS/login.js"></script>

</body>
</html>
