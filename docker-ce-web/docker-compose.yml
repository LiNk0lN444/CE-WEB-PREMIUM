services:
  db:
    image: postgres:16-alpine
    container_name: ce_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-ce_web}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Los .sql de esta carpeta se ejecutan SOLO la primera vez (cuando el volumen está vacío)
      - ./DATABASE/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"   # opcional: para conectarte con DBeaver/pgAdmin desde tu PC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ce_web}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./FAST-API
    container_name: ce_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ce_web}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ce-web.com}
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      args:
        # La URL que usa el NAVEGADOR para llegar a la API (no el nombre interno del contenedor)
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: ce_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  pgdata:
