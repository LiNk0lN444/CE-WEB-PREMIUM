# Levanta TODO el proyecto: base de datos + API + frontend
# Uso:  docker compose up --build

services:
  # ---------------- BASE DE DATOS (PostgreSQL) ----------------
  db:
    image: postgres:16-alpine
    container_name: ce_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-ce_web}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Los .sql de esta carpeta se ejecutan SOLO la primera vez (volumen vacío)
      - ./DATABASE/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"   # opcional: para conectarte con DBeaver/pgAdmin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ce_web}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------- API (FastAPI) ----------------
  api:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.12-slim
        ENV PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1
        WORKDIR /app
        COPY FAST-API/requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY FAST-API/ .
        EXPOSE 8000
        CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    container_name: ce_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ce_web}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ce-web.com}
    ports:
      - "8000:8000"

  # ---------------- FRONTEND (React + Vite -> nginx) ----------------
  web:
    build:
      context: .
      args:
        # URL de la API tal como la ve el NAVEGADOR
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      # OJO: en este archivo "$$" significa un "$" literal
      dockerfile_inline: |
        # syntax=docker/dockerfile:1
        FROM node:22-alpine AS build
        WORKDIR /app
        COPY package.json package-lock.json ./
        RUN npm ci
        COPY index.html vite.config.js ./
        COPY src ./src
        ARG VITE_API_URL
        RUN npm run build

        FROM nginx:1.27-alpine
        COPY <<'NGINX' /etc/nginx/conf.d/default.conf
        server {
            listen 80;
            root /usr/share/nginx/html;
            index index.html;
            location / {
                try_files $$uri /index.html;
            }
        }
        NGINX
        COPY --from=build /app/dist /usr/share/nginx/html
        EXPOSE 80
    container_name: ce_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  pgdata:
